[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncx-derivatives"
version = "0.2.0"
description = "A quantitative derivatives research and market-making platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
dev = [
    "pandas>=2.0",
    "pytest>=8.0",
    "tzdata>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m \"not large\""
markers = [
    "large: large smoke and performance tests run separately from the normal suite",
]
